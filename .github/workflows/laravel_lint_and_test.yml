name: Laravel Lint and Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  laravel_lint_and_test:
    name: Laravel Test and PHPStan (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php }}
        extensions: mbstring, pdo_mysql, exif, pcntl

    - name: Validate Composer Metadata
      run: composer validate --strict

    - name: Install Composer Dependencies
      run: composer install --no-progress --no-suggest --no-interaction --prefer-dist

    - name: Create Environment File
      run: cp .env.example .env

    - name: Generate Application Key
      run: php artisan key:generate

    - name: Run phpcs
      run: composer phpcs

    - name: Run phpinsights
      run: vendor/bin/phpinsights --no-interaction

    - name: Run phpstan
      run: tools/scripts/phpstan-all-files.sh

    - name: Validate Hexagonal Architecture
      run: php artisan hexagonal:validate

    - name: Run Laravel Tests
      run: composer test
