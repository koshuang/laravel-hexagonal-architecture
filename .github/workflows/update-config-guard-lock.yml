name: Update Config Guard Lock

on:
  push:
    branches:
      - feat/config-guard-smoke-test

permissions:
  contents: write

jobs:
  update-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/config-guard-smoke-test

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Update lock file
        run: composer update koshuang/laravel-config-guard --with-all-dependencies --no-interaction --prefer-dist

      - name: Commit lock file
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add composer.lock
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: lock config guard v0.1.0"
          git push origin HEAD:feat/config-guard-smoke-test
