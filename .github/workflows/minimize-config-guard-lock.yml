name: Minimize Config Guard Lock

on:
  push:
    branches:
      - feat/config-guard-smoke-test

permissions:
  contents: write

jobs:
  update-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/config-guard-smoke-test
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Rebuild minimal lock change
        run: |
          git checkout origin/main -- composer.lock
          composer update koshuang/laravel-config-guard --no-interaction --prefer-dist

      - name: Commit lock file
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add composer.lock
          git commit -m "chore: minimize config guard lock update"
          git push origin HEAD:feat/config-guard-smoke-test
