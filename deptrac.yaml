# deptrac.yaml
deptrac:
  paths:
    - ./Modules
  exclude_files:
    # - '#.*Test.*#'
  ignore_uncovered_internal_classes: true
  layers:
    -
      name: Infrastructure
      collectors:
        -
          type: classLike
          value: .*Modules\\Account\\Infrastructure\\.*
    -
      name: Application
      collectors:
        -
          type: classLike
          value: .*Modules\\Account\\Application\\.*
    -
      name: Domain
      collectors:
        -
          type: classLike
          value: .*Modules\\Account\\Domain\\.*
    -
      name: Shared
      collectors:
        -
          type: classLike
          value: .*Modules\\Shared\\.*
    -
      name: Illuminate
      collectors:
        -
          type: classLike
          value: .*Illuminate\\(?!Support).*
    -
      name: IlluminateSupportFacade
      collectors:
        -
          type: classLike
          value: .*Illuminate\\Support\\Facades\\.*
    -
      name: IlluminateSupportExcludeFacade
      collectors:
        -
          type: classLike
          value: .*Illuminate\\Support\\(?!Facades).*
    -
      name: Carbon
      collectors:
        -
          type: classLike
          value: .*Carbon\\.*
  ruleset:
    Infrastructure:
      - Application
      - Domain
      - Shared
      - Illuminate
      - IlluminateSupportFacade
      - IlluminateSupportExcludeFacade
      - Carbon
    Application:
      - Domain
      - Shared
      - IlluminateSupportExcludeFacade
      - Carbon
    Domain:
      - Shared
      - IlluminateSupportExcludeFacade
      - Carbon
